[workspace]
members = ["motif", "launcher"]

[package]
name = "bpm-caddy"
version = "0.1.0"
edition = "2021"
description = "Clinical pharmacy workflow & analytics — fast, local, encrypted."
license-file = "LICENSE"
repository = "https://github.com/youssefsahli/bpm-caddy"
publish = false

[dependencies]
eframe = "0.29"
motif = { path = "motif" }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
