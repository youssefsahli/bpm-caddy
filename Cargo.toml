[workspace]
members = ["motif", "launcher", "sync"]

[package]
name = "bpm-caddy"
version = "0.342.0"
edition = "2021"
description = "Clinical pharmacy workflow & analytics — fast, local, encrypted."
license-file = "LICENSE"
repository = "https://github.com/youssefsahli/bpm-caddy"
publish = false

[dependencies]
eframe = "0.29"
motif = { path = "motif" }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
typst = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
open = "5.4.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.15"
# Validates a chosen font file before egui is asked to parse it.
ab_glyph = "0.2"
lopdf = { version = "0.44.0", default-features = false }
# Only ever used by Options › À propos, on a button press, on a worker
# thread: the application asks GitHub which release is the latest and
# says whether this copy is behind. Nothing else reaches the network —
# every other « … » button hands a URL to the browser and stops there.
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# L'empreinte d'un fichier joint à un message : vérifiée avant de
# l'enregistrer. Déjà dans l'arbre par bpm-sync.
blake3 = "1"
# Reading a carte Vitale through a PC/SC reader. The system's card
# library is opened by name at the moment a card is asked for, never
# linked against: a binary linked to libpcsclite does not start at all on
# a post that has none, and most posts have none. See src/winscard.rs.
libloading = "0.8"
# La console de scripts (voir src/script.rs). Rhai est du Rust pur et
# **n'a aucune entrée-sortie** : pas de fichier, pas de réseau, pas de
# processus. C'est la raison pour laquelle c'est celui-là et pas un
# autre — un script tapé dans une application qui tient des données de
# santé chiffrées ne doit pas pouvoir les faire sortir. Le seul chemin
# qu'un script a vers le monde est le volet où il écrit.
rhai = { version = "1.25", default-features = false, features = ["std", "sync"] }
# La synchronisation pair-à-pair, chiffrée de bout en bout (voir
# `sync/` et `docs/SYNC.md`). **Optionnelle** — allumée par défaut depuis
# le réseau d'officines, qui n'en utilise qu'un flux sans patient :
# c'est le seul module qui ouvre un chemin réseau dans une application
# dont toute la posture est « tout est local ». `optional = true` n'est
# donc pas une commodité de compilation, c'est la règle — un binaire
# construit sans `--features sync` ne contient ni socket d'écoute, ni
# protocole, ni rien à attaquer. Le crate est quand même membre de
# l'atelier, donc l'intégration continue le compile et le teste à
# chaque fois : optionnel ne veut pas dire non surveillé.
bpm-sync = { path = "sync", optional = true }

[features]
# Le réseau d'officines (voir `src/network.rs`) est livré : il ne
# partage que les ruptures et les substitutions, sous sa propre clé, et
# n'ouvre une porte que le temps d'une invitation — rien n'écoute en
# permanence. Un binaire construit avec `--no-default-features` n'en
# contient toujours rien.
default = ["sync"]
sync = ["dep:bpm-sync"]


[profile.release]
lto = true
strip = true
codegen-units = 1
