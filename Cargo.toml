[workspace]
members = ["motif", "launcher"]

[package]
name = "bpm-caddy"
version = "0.119.0"
edition = "2021"
description = "Clinical pharmacy workflow & analytics — fast, local, encrypted."
license-file = "LICENSE"
repository = "https://github.com/youssefsahli/bpm-caddy"
publish = false

[dependencies]
eframe = "0.29"
motif = { path = "motif" }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
typst = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
open = "5.4.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.15"
# Validates a chosen font file before egui is asked to parse it.
ab_glyph = "0.2"
lopdf = { version = "0.44.0", default-features = false }
# Only ever used by Options › À propos, on a button press, on a worker
# thread: the application asks GitHub which release is the latest and
# says whether this copy is behind. Nothing else reaches the network —
# every other « … » button hands a URL to the browser and stops there.
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# Reading a carte Vitale through a PC/SC reader. The system's card
# library is opened by name at the moment a card is asked for, never
# linked against: a binary linked to libpcsclite does not start at all on
# a post that has none, and most posts have none. See src/winscard.rs.
libloading = "0.8"


[profile.release]
lto = true
strip = true
codegen-units = 1
