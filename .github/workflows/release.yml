name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Le dépôt Chrome préinstallé sur le runner a fait tomber la
          # publication de la v0.172.0 sur un « Hash Sum mismatch »
          # qui n'avait rien à voir avec ce dépôt-ci — et on n'en tire
          # rien. On l'enlève ; **nommément**, jamais au glob : sur les
          # images 24.04 les sources d'Ubuntu elles-mêmes vivent dans
          # `sources.list.d/ubuntu.sources`, et un `rm *` les emporterait.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          # Et la mise à jour n'est pas le garde-fou : un dépôt tiers
          # cassé ne doit pas arrêter la publication. C'est `install`
          # qui échoue, bruyamment, s'il manque quelque chose.
          sudo apt-get update || true
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Pas de cache ici : la tâche publie, et un cache empoisonné
      # passerait dans le binaire de chaque officine.
      - name: Build
        # La passerelle de la messagerie des patients livrée avec
        # l'application (`BUILT_IN_GATEWAY`) : une variable du dépôt,
        # vide tant que personne n'en tient une — il faut alors la régler.
        env:
          BPM_CADDY_PASSERELLE: ${{ vars.BPM_CADDY_PASSERELLE }}
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Rename artifacts
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/bpm-caddy${{ matrix.ext }}" \
             "bpm-caddy-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/bpm-caddy-launcher${{ matrix.ext }}" \
             "bpm-caddy-launcher-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/bpm-audit${{ matrix.ext }}" \
             "bpm-audit-${{ matrix.suffix }}${{ matrix.ext }}"
      # Pas encore à la publication : chaque tâche publiait seule, et la
      # version devenait « latest » dès la première arrivée — la 0.427.0
      # l'a été vingt-six minutes avec l'APK seul, et chaque lanceur
      # Windows répondait « pas de binaire » jusqu'à la fin de sa tâche.
      # `publish`, plus bas, attache tout d'un coup.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.suffix }}
          if-no-files-found: error
          path: |
            bpm-caddy-${{ matrix.suffix }}${{ matrix.ext }}
            bpm-caddy-launcher-${{ matrix.suffix }}${{ matrix.ext }}
            bpm-audit-${{ matrix.suffix }}${{ matrix.ext }}

  # Le compagnon Android, **signé de la clé d'importation Play** et joint à
  # la version sous `bpm-caddy-compagnon.apk`. La clé vit dans les secrets
  # du dépôt (BPM_ANDROID_KEYSTORE_B64 : le fichier .jks en base64, et les
  # trois autres sous les noms que lit `app/build.gradle.kts`) — jamais
  # dans le dépôt. Sans elle, la tâche échoue : un APK non signé ne
  # s'installe pas, et le publier sous ce nom tromperait l'équipe qui le
  # télécharge. Le lanceur ne lit que les binaires des postes (APP_ASSET) :
  # cet actif-ci ne le concerne pas.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      # Pas de cache ici : la tâche publie, et un cache empoisonné
      # passerait dans le binaire de chaque officine.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo install cargo-ndk --locked
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.BPM_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "secret BPM_ANDROID_KEYSTORE_B64 absent" >&2; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      # Gradle builds the Rust side itself (`buildRust`, before `preBuild`).
      - name: APK
        working-directory: android
        env:
          BPM_ANDROID_STORE_FILE: ${{ runner.temp }}/upload.jks
          BPM_ANDROID_STORE_PASSWORD: ${{ secrets.BPM_ANDROID_STORE_PASSWORD }}
          BPM_ANDROID_KEY_ALIAS: ${{ secrets.BPM_ANDROID_KEY_ALIAS }}
          BPM_ANDROID_KEY_PASSWORD: ${{ secrets.BPM_ANDROID_KEY_PASSWORD }}
        # Le NDK du runner, lu dans son environnement (voir ci.yml).
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew assembleRelease --console=plain
      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          ./android/verify-apk.sh "$apk"
          cp "$apk" bpm-caddy-compagnon.apk
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          if-no-files-found: error
          path: bpm-caddy-compagnon.apk

  # **La version paraît entière, ou ne paraît pas.** Les trois binaires
  # des postes sont exigés : sans l'un d'eux, rien n'est publié, et les
  # lanceurs restent sur la version d'avant au lieu de trouver une
  # « latest » sans leur fichier. L'APK suit s'il a été construit ; son
  # échec ne retient pas les postes.
  publish:
    needs: [build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Every post binary is there
        run: |
          ls -l dist
          for f in bpm-caddy-linux-x86_64 bpm-caddy-windows-x86_64.exe bpm-caddy-macos-arm64 \
                   bpm-caddy-launcher-linux-x86_64 bpm-caddy-launcher-windows-x86_64.exe \
                   bpm-caddy-launcher-macos-arm64; do
            test -s "dist/$f" || { echo "absent : $f" >&2; exit 1; }
          done
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
