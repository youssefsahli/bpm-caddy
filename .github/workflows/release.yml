name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Rename artifacts
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/bpm-caddy${{ matrix.ext }}" \
             "bpm-caddy-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/bpm-caddy-launcher${{ matrix.ext }}" \
             "bpm-caddy-launcher-${{ matrix.suffix }}${{ matrix.ext }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bpm-caddy-${{ matrix.suffix }}${{ matrix.ext }}
            bpm-caddy-launcher-${{ matrix.suffix }}${{ matrix.ext }}
          generate_release_notes: true
