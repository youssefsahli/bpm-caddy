name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The floors are in the script, and they only ever move up.
      - run: ./scripts/coverage.sh

  # The interface has no unit tests — a view cannot be covered without a
  # harness, and egui_kittest needs egui >= 0.30 while this is on 0.29.
  # `smoke.sh` is what stands in for them, and it only ever ran when
  # somebody remembered. It opens every view in two shapes, and the
  # second one is the point: `f32::clamp` panics when a computed floor
  # crosses a computed cap, and floors only cross caps on a short pane
  # at large text.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # eframe draws through OpenGL, which it opens at run time rather
      # than linking: a runner with no GPU needs Mesa's software
      # rasteriser, and needs to be told to use it rather than probe for
      # hardware that is not there.
      #
      # If this job ever fails because the application will not start,
      # the two honest answers are to fix the packages or to drop the
      # job. Making it pass regardless is the one thing not to do: the
      # script's whole check is « no panic came out », and a binary that
      # never ran produces no panic either.
      - run: ./scripts/smoke.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
