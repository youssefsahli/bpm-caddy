# La page de la messagerie des patients, publiée sur GitHub Pages à part
# de la passerelle (src/patientchat.rs, `PAGE_SITE`) : qui tient une
# passerelle ne touche pas au code qui chiffre.
#
# Chaque version de la page a son dossier, nommé par son empreinte — celle
# que `patientchat::page_hash` calcule, et un test tient la recette ici.
# Le site est refait en entier depuis chaque étiquette et `main` : un
# dossier publié ne change jamais, et un code imprimé l'an passé ouvre
# toujours la page de l'an passé. Seules les versions qui appellent la
# passerelle nommée par le lien (la marque ci-dessous) sont publiées.
name: page

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['assets/patient/**', '.github/workflows/page.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chaque version de la page, sous son empreinte
        run: |
          set -eu
          mark='// bpm-page: hors passerelle'
          mkdir -p site
          for ref in $(git tag -l 'v*') HEAD; do
            dir=$(mktemp -d)
            ok=1
            for f in index.html app.js style.css; do
              git show "$ref:assets/patient/$f" > "$dir/$f" 2>/dev/null || ok=0
            done
            if [ "$ok" != 1 ] || ! grep -qF "$mark" "$dir/app.js"; then
              continue
            fi
            h=$(cd "$dir" && cat index.html app.js style.css | sha256sum | cut -c1-16)
            mkdir -p "site/$h"
            cp "$dir/index.html" "$dir/app.js" "$dir/style.css" "site/$h/"
            echo "$ref -> $h"
          done
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="fr"><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>Messagerie des patients</title>
          <p>La messagerie de votre pharmacie s'ouvre avec le code QR qu'elle vous a remis.</p>
          </html>
          HTML
          ls site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
