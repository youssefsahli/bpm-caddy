# Clé de l'anneau rouge de la carte de voisinage, et ce que son
# infobulle ajoute.
#
# **Il dit ce que la donnée dit, et pas plus.** L'anneau est tracé quand
# la fiche porte une section « Toxicité / marge thérapeutique » — 484
# fiches sur 862 —, ce qui n'est pas la même chose qu'une marge étroite
# au sens clinique : Zeclar, Sporanox et Rifadine le portent, Digoxine
# et Tégrétol aussi. Écrire « marge thérapeutique étroite » sur cette
# clé aurait rendu visible une affirmation fausse pour la plupart des
# nœuds cerclés, ce qui est pire qu'un anneau sans clé.
