[package]
name = "bpm-caddy-launcher"
version = "0.22.0"
edition = "2021"
description = "Auto-updating launcher for BPM-Caddy: fetches the latest release, then starts the app."
license-file = "../LICENSE"
publish = false

[dependencies]
eframe = "0.29"
motif = { path = "../motif" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
dirs = "5"
