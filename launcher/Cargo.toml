[package]
name = "bpm-caddy-launcher"
version = "0.434.0"
edition = "2021"
description = "Auto-updating launcher for BPM-Caddy: fetches the latest release, then starts the app."
license-file = "../LICENSE"
publish = false

# L'icône dans le `.exe` (build.rs), sur la machine qui construit pour Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.29"
motif = { path = "../motif" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
dirs = "5"
