[package]
name = "bpm-caddy-launcher"
version = "0.438.0"
edition = "2021"
description = "Auto-updating launcher for BPM-Caddy: fetches the latest release, then starts the app."
license-file = "../LICENSE"
publish = false

# L'icône dans le `.exe` (build.rs), sur la machine qui construit pour Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.29"
motif = { path = "../motif" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
dirs = "5"
# La signature des mises à jour (minisign) : vérifiée avant d'installer,
# dès que `update-key.pub` porte une clé.
minisign-verify = "0.2"

[dev-dependencies]
# Des signatures minisign de test, faites comme la commande les fait.
ed25519-dalek = "2"
blake2 = "0.10"
base64 = "0.22"
